<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos Brina</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/index.css">
</head>
<body>
    
    <header>
        <h1>Galeria Brina</h1>
    </header>

    <div class="galeria">
      <img src="./assets/argentina.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/arresting.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/brazillian-cowgirl.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/brinas-pit-stop.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/clip-house-tour.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/coachella-body-black-2.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/coachella-body-black.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/coachella-car.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/coachella-chair.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/happy-easter.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/peaky-blinder.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/wallpaper-short-n-sweet-2.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
      <img src="./assets/wallpaper-short-n-sweet.jpg" alt="Photo" class="foto-miniatura" onclick="abrirModal(this.src)">
    </div>
    
    <div id="meuModal" class="modal">
      <span class="fechar" onclick="fecharModal()">&times;</span>
      <img class="modal-conteudo" id="imagemAmpliada" alt="Imagem ampliada">
      
      <div class="controles-modal">
          <a id="linkDownload" href="" download="brina_foto.jpg" class="botao-download">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Baixar Foto
          </a>
      </div>
    </div>
    
    <script src="./script/index.js"></script>
</body>
</html>
